!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSafe Pro - Simulador Avanzado de Seguridad en Energías Renovables</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        cyber: {
                            950: '#030712',
                            900: '#0b0f19',
                            800: '#111827',
                            700: '#1f2937',
                            600: '#374151',
                            accent: '#f59e0b', // Amber/Safety Yellow
                            cyan: '#06b6d4',
                            emerald: '#10b981',
                            rose: '#f43f5e',
                            purple: '#8b5cf6'
                        }
                    },
                    boxShadow: {
                        'neon-amber': '0 0 20px rgba(245, 158, 11, 0.25)',
                        'neon-cyan': '0 0 20px rgba(6, 182, 212, 0.25)',
                        'neon-rose': '0 0 20px rgba(244, 63, 94, 0.25)',
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }        .glass-panel { background: linear-gradient(135deg, rgba(17,24,39,.94), rgba(15,23,42,.82)); backdrop-filter: blur(14px); }
        .map-zone { transition: all .2s ease; cursor: pointer; }
        .map-zone:hover, .map-zone.selected { filter: brightness(1.35); stroke: #fbbf24; stroke-width: 3; }
        .switch-on { background: #10b981 !important; color: #03120d; box-shadow: 0 0 16px rgba(16,185,129,.5); }
        @media print { body * { visibility: hidden !important; } #certificate, #certificate * { visibility: visible !important; } #certificate { position: absolute; inset: 0; } }
        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.02); }
        }
        .animate-glow { animation: pulseGlow 2.5s infinite ease-in-out; }
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1000%); }
        }
        .scanline::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(to bottom, transparent, rgba(6, 182, 212, 0.3), transparent);
            animation: scanline 4s linear infinite;
            pointer-events: none;
        }
        .energy-background {
            background:
                radial-gradient(circle at 12% 18%, rgba(245, 158, 11, 0.12), transparent 24rem),
                radial-gradient(circle at 88% 28%, rgba(6, 182, 212, 0.12), transparent 26rem),
                linear-gradient(135deg, rgba(3, 7, 18, 0.98), rgba(11, 15, 25, 0.98));
        }
        .energy-background::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.22;
            background-image:
                linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: linear-gradient(to bottom, black, transparent 85%);
        }
        .energy-orb {
            position: absolute;
            width: 18rem;
            height: 18rem;
            border-radius: 9999px;
            pointer-events: none;
            filter: blur(2px);
            opacity: 0.16;
        }
        .energy-orb-sun {
            top: 7rem;
            left: -7rem;
            border: 1px solid rgba(245, 158, 11, 0.7);
            box-shadow: 0 0 0 2rem rgba(245, 158, 11, 0.04), 0 0 0 5rem rgba(245, 158, 11, 0.03);
            animation: solarPulse 6s ease-in-out infinite;
        }
        .energy-orb-wind {
            right: -8rem;
            bottom: 5rem;
            border: 1px solid rgba(6, 182, 212, 0.7);
            box-shadow: 0 0 0 2rem rgba(6, 182, 212, 0.04), 0 0 0 5rem rgba(6, 182, 212, 0.03);
            animation: windDrift 9s ease-in-out infinite;
        }
        .energy-motif {
            position: absolute;
            z-index: 0;
            color: rgba(148, 163, 184, 0.18);
            pointer-events: none;
        }
        .energy-motif-sun {
            top: 8rem;
            right: 8%;
            color: rgba(245, 158, 11, 0.26);
            animation: solarPulse 6s ease-in-out infinite;
        }
        .energy-motif-wind {
            bottom: 6rem;
            left: 6%;
            color: rgba(6, 182, 212, 0.22);
            animation: windDrift 8s ease-in-out infinite;
        }
        .energy-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245, 158, 11, 0.5), rgba(6, 182, 212, 0.5), transparent);
        }
        @keyframes solarPulse {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.65; }
            50% { transform: scale(1.08) rotate(8deg); opacity: 1; }
        }
        @keyframes windDrift {
            0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
            50% { transform: translate3d(-12px, -8px, 0) rotate(-5deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .energy-orb-sun, .energy-orb-wind, .energy-motif-sun, .energy-motif-wind {
                animation: none;
            }
        }
    </style>
</head>
<body class="h-full bg-cyber-950 text-slate-100 font-sans antialiased flex flex-col justify-between selection:bg-amber-500 selection:text-cyber-950 overflow-x-hidden energy-background">

    <div x-data="advancedSimulator()" class="min-h-full flex flex-col justify-between scanline relative" x-init="init()">
        <!-- Ambient renewable-energy decoration -->
        <div class="energy-orb energy-orb-sun" aria-hidden="true"></div>
        <div class="energy-orb energy-orb-wind" aria-hidden="true"></div>
        <i data-lucide="sun" class="energy-motif energy-motif-sun w-28 h-28" aria-hidden="true"></i>
        <i data-lucide="wind" class="energy-motif energy-motif-wind w-32 h-32" aria-hidden="true"></i>
        
        <!-- Header / HUD Navbar -->
        <header class="bg-cyber-900/90 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-50 px-4 py-3 shadow-2xl">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-3 cursor-pointer group" @click="returnToHome()">
                    <div class="bg-gradient-to-br from-amber-500 to-amber-600 p-2.5 rounded-xl text-cyber-950 shadow-neon-amber group-hover:scale-105 transition">
                        <i data-lucide="shield-check" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-base md:text-lg font-extrabold tracking-tight text-white flex items-center gap-2">
                            ECOSAFE <span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-full uppercase tracking-wider font-bold">PRO V3.5</span>
                        </h1>
                        <p class="text-[11px] text-slate-400">Simulador de Seguridad & Protocolos en Energías Renovables</p>
                    </div>
                </div>

                <!-- HUD Stats & Progress Tracker -->
                <template x-if="currentScreen !== 'home'">
                    <div class="flex items-center flex-wrap gap-3 md:gap-6 bg-cyber-950/80 px-4 py-2 rounded-2xl border border-slate-800">
                        <!-- XP / Score -->
                        <div class="flex items-center gap-2">
                            <div class="p-1.5 rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/20">
                                <i data-lucide="zap" class="w-4 h-4"></i>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-[9px] uppercase font-bold text-slate-400">Puntos XP</span>
                                <span class="text-xs font-mono font-bold text-amber-400" x-text="xp + ' XP'"></span>
                            </div>
                        </div>

                        <!-- Safety Index Meter -->
                        <div class="flex flex-col">
                            <div class="flex justify-between items-center text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-0.5">
                                <span>Índice Seguridad</span>
                                <span class="font-mono" :class="safetyScore >= 70 ? 'text-emerald-400' : safetyScore >= 40 ? 'text-amber-400' : 'text-rose-400'" x-text="safetyScore + '%'"></span>
                            </div>
                            <div class="w-28 md:w-36 bg-slate-900 h-2.5 rounded-full overflow-hidden p-0.5 border border-slate-700/80">
                                <div class="h-full rounded-full transition-all duration-500 shadow-sm"
                                     :class="safetyScore >= 70 ? 'bg-emerald-500' : safetyScore >= 40 ? 'bg-amber-500' : 'bg-rose-500'"
                                     :style="`width: ${safetyScore}%`"></div>
                            </div>
                        </div>

                        <!-- Risk Meter badge -->
                        <div class="hidden sm:flex items-center gap-2 px-2.5 py-1 rounded-xl border text-[11px] font-semibold"
                             :class="riskLevel === 'BAJO' ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' : riskLevel === 'MODERADO' ? 'bg-amber-500/10 border-amber-500/30 text-amber-400' : 'bg-rose-500/10 border-rose-500/30 text-rose-400'">
                            <i data-lucide="activity" class="w-3.5 h-3.5"></i>
                            <span>Riesgo: <strong x-text="riskLevel"></strong></span>
                        </div>

                        <button @click="returnToHome()" class="text-xs text-slate-400 hover:text-white bg-slate-800/80 hover:bg-slate-700 px-3 py-1.5 rounded-xl transition border border-slate-700 flex items-center gap-1.5">
                            <i data-lucide="home" class="w-3.5 h-3.5"></i> Menú
                        </button>
                    </div>
                </template>
            </div>
        </header>

        <!-- Main Dynamic Viewport -->
        <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6 my-auto">

            <template x-if="currentScreen !== 'home'">
                <section class="glass-panel mb-5 rounded-2xl border border-slate-700/80 p-4 shadow-xl">
                    <div class="flex flex-wrap items-center justify-between gap-3"><div class="flex items-center gap-3"><i data-lucide="route" class="w-5 h-5 text-cyan-400"></i><div><p class="text-[10px] uppercase tracking-widest text-slate-400">Progreso de entrenamiento</p><p class="text-sm font-bold text-white" x-text="progressLabel"></p></div></div><div class="flex items-center gap-2 text-xs"><span class="px-2 py-1 rounded-lg border" :class="mode==='evaluacion'?'border-rose-500/40 text-rose-300 bg-rose-500/10':'border-cyan-500/40 text-cyan-300 bg-cyan-500/10'" x-text="mode==='evaluacion'?'EVALUACIÓN':'PRÁCTICA'"></span><span class="text-slate-400">Clima: <b class="text-amber-300" x-text="weather.label"></b></span></div></div>
                    <div class="mt-3 h-2 rounded-full bg-slate-800 overflow-hidden"><div class="h-full bg-gradient-to-r from-cyan-400 to-amber-400 transition-all" :style="`width:${progressPercent}%`"></div></div>
                    <div class="mt-3 grid grid-cols-2 sm:grid-cols-4 gap-2 text-[11px]"><div class="bg-slate-950/70 rounded-lg p-2"><span class="text-slate-500">EPP</span><b class="block text-amber-300" x-text="scoreBreakdown.epp+' / 25'"></b></div><div class="bg-slate-950/70 rounded-lg p-2"><span class="text-slate-500">Procedimiento</span><b class="block text-cyan-300" x-text="scoreBreakdown.procedure+' / 35'"></b></div><div class="bg-slate-950/70 rounded-lg p-2"><span class="text-slate-500">Tiempo</span><b class="block text-emerald-300" x-text="scoreBreakdown.time+' / 20'"></b></div><div class="bg-slate-950/70 rounded-lg p-2"><span class="text-slate-500">LOTO</span><b class="block text-purple-300" x-text="scoreBreakdown.loto+' / 20'"></b></div></div>
                </section>
            </template>

            <!-- SCREEN 1: HOME & MODULE SELECTOR -->
            <template x-if="currentScreen === 'home'">
                <div class="space-y-8 py-6">
                    <div class="text-center max-w-3xl mx-auto space-y-4">
                        <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-xs font-semibold">
                            <i data-lucide="shield-alert" class="w-3.5 h-3.5"></i> Plataforma Interactiva de Alta Tensión & Altura
                        </div>
                        <h2 class="text-3xl md:text-5xl font-extrabold tracking-tight text-white leading-tight">
                            Domina la Seguridad en <span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-amber-200">Energías Renovables</span>
                        </h2>
                        <p class="text-slate-400 text-sm md:text-base">
                            Enfréntate a misiones de campo interactivas, equipa EPP especializado clase 0/4, ejecuta secuencias LOTO de seccionamiento y supera emergencias climáticas.
                        </p>
                        <div class="energy-divider max-w-sm mx-auto"></div>
                        <div class="flex justify-center flex-wrap gap-2 text-[10px] uppercase tracking-widest font-bold text-slate-500">
                            <span class="flex items-center gap-1.5"><i data-lucide="sun" class="w-3.5 h-3.5 text-amber-400"></i> Energía solar</span>
                            <span class="text-slate-700">•</span>
                            <span class="flex items-center gap-1.5"><i data-lucide="wind" class="w-3.5 h-3.5 text-cyan-400"></i> Energía eólica</span>
                            <span class="text-slate-700">•</span>
                            <span class="flex items-center gap-1.5"><i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-400"></i> Seguridad</span>
                        </div>
                    </div>

                    <div class="grid lg:grid-cols-[1.2fr_.8fr] gap-4">
                        <div class="bg-cyber-900/80 border border-slate-800 rounded-2xl p-4 space-y-3"><div class="flex flex-wrap items-center justify-between gap-3"><label class="text-xs font-bold text-slate-300">Participante <input x-model="participantName" @change="persist()" class="ml-2 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="Nombre completo"></label><div class="flex gap-2"><button @click="setMode('practica')" class="px-3 py-2 rounded-lg text-xs font-bold border" :class="mode==='practica'?'bg-cyan-500/20 border-cyan-400 text-cyan-300':'border-slate-700 text-slate-400'">Práctica</button><button @click="setMode('evaluacion')" class="px-3 py-2 rounded-lg text-xs font-bold border" :class="mode==='evaluacion'?'bg-rose-500/20 border-rose-400 text-rose-300':'border-slate-700 text-slate-400'">Evaluación</button><button @click="toggleMute()" class="p-2 rounded-lg border border-slate-700 text-slate-300"><i :data-lucide="muted?'volume-x':'volume-2'" class="w-4 h-4"></i></button></div></div><div class="flex flex-wrap gap-2"><button @click="continueProgress()" class="px-3 py-2 rounded-lg bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-xs">Continuar sesión</button><button @click="resetProgress()" class="px-3 py-2 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs">Restablecer</button><button @click="exportResults()" class="px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 text-xs">Exportar resultados</button></div></div>
                        <div class="bg-cyber-900/80 border border-slate-800 rounded-2xl p-4"><div class="flex justify-between items-center mb-2"><span class="text-xs font-bold text-white">Condiciones y zona</span><span class="text-[10px] text-amber-300" x-text="weather.risk"></span></div><div class="flex gap-2 mb-3"><template x-for="w in weatherOptions"><button @click="setWeather(w.id)" class="flex-1 p-2 rounded-lg border text-[10px]" :class="weather.id===w.id?'border-amber-400 bg-amber-500/15 text-amber-200':'border-slate-700 text-slate-400'" x-text="w.label"></button></template></div><div class="grid grid-cols-3 gap-2"><template x-for="zone in zones"><button @click="selectedZone=zone.id; persist()" class="p-2 rounded-lg border text-left text-[10px]" :class="selectedZone===zone.id?'border-cyan-400 bg-cyan-500/15 text-cyan-200':'border-slate-700 text-slate-400'"><span x-text="zone.icon"></span> <span x-text="zone.name"></span></button></template></div></div>
                    </div>

                    <!-- Module Cards Grid -->
                    <div class="grid md:grid-cols-2 gap-6 pt-2">
                        <!-- Photovoltaic Module -->
                        <div @click="selectModule('pv')" class="group relative bg-cyber-900 border border-slate-800 hover:border-amber-500/60 rounded-3xl p-6 md:p-8 transition-all duration-300 hover:shadow-neon-amber cursor-pointer overflow-hidden flex flex-col justify-between">
                            <div class="absolute -right-12 -bottom-12 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl group-hover:bg-amber-500/20 transition"></div>
                            <div class="space-y-5 relative z-10">
                                <div class="w-14 h-14 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 group-hover:scale-110 transition duration-300 shadow-md">
                                    <i data-lucide="sun" class="w-7 h-7"></i>
                                </div>
                                <div>
                                    <h3 class="text-2xl font-bold text-white group-hover:text-amber-400 transition">Sistemas Fotovoltaicos (FV)</h3>
                                    <p class="text-xs text-slate-400 mt-1.5 leading-relaxed">Arco eléctrico DC de hasta 1500V, radiación solar continua, seccionamiento de inversores, bornes y puesta a tierra de estructuras.</p>
                                </div>
                                <div class="flex flex-wrap gap-2 pt-2">
                                    <span class="text-[11px] bg-slate-800/80 text-amber-300 px-3 py-1 rounded-lg border border-slate-700">EPP Arc-Flash 40 cal/cm²</span>
                                    <span class="text-[11px] bg-slate-800/80 text-slate-300 px-3 py-1 rounded-lg border border-slate-700">Corte DC LOTO</span>
                                </div>
                            </div>
                            <div class="pt-8 flex items-center justify-between text-sm font-semibold text-amber-400 relative z-10">
                                <span class="flex items-center gap-1.5 group-hover:translate-x-1.5 transition">Iniciar Misión FV <i data-lucide="arrow-right" class="w-4 h-4"></i></span>
                                <span class="text-xs text-slate-500 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">6 Misiones / 3 Minijuegos</span>
                            </div>
                        </div>

                        <!-- Wind Turbine Module -->
                        <div @click="selectModule('wind')" class="group relative bg-cyber-900 border border-slate-800 hover:border-cyan-500/60 rounded-3xl p-6 md:p-8 transition-all duration-300 hover:shadow-neon-cyan cursor-pointer overflow-hidden flex flex-col justify-between">
                            <div class="absolute -right-12 -bottom-12 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl group-hover:bg-cyan-500/20 transition"></div>
                            <div class="space-y-5 relative z-10">
                                <div class="w-14 h-14 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 group-hover:scale-110 transition duration-300 shadow-md">
                                    <i data-lucide="wind" class="w-7 h-7"></i>
                                </div>
                                <div>
                                    <h3 class="text-2xl font-bold text-white group-hover:text-cyan-400 transition">Parques Eólicos</h3>
                                    <p class="text-xs text-slate-400 mt-1.5 leading-relaxed">Trabajos en altura extrema (>80m), tormentas eléctricas súbitas, frenado mecánico de emergencia, líneas de vida y puesta a tierra de góndolas.</p>
                                </div>
                                <div class="flex flex-wrap gap-2 pt-2">
                                    <span class="text-[11px] bg-slate-800/80 text-cyan-300 px-3 py-1 rounded-lg border border-slate-700">Arnés Anticaídas Certificado</span>
                                    <span class="text-[11px] bg-slate-800/80 text-slate-300 px-3 py-1 rounded-lg border border-slate-700">Tormentas y Rayos</span>
                                </div>
                            </div>
                            <div class="pt-8 flex items-center justify-between text-sm font-semibold text-cyan-400 relative z-10">
                                <span class="flex items-center gap-1.5 group-hover:translate-x-1.5 transition">Iniciar Misión Eólica <i data-lucide="arrow-right" class="w-4 h-4"></i></span>
                                <span class="text-xs text-slate-500 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">6 Misiones / 3 Minijuegos</span>
                            </div>
                        </div>
                    </div>

                    <!-- Achievements & Trophies Bar -->
                    <div class="bg-cyber-900/60 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <div class="p-2.5 bg-purple-500/10 text-purple-400 rounded-xl border border-purple-500/20">
                                <i data-lucide="award" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h4 class="text-sm font-bold text-white">Insignias Desbloqueadas (<span x-text="unlockedBadgesCount"></span>/4)</h4>
                                <p class="text-xs text-slate-400">Completa misiones sin perder índice de seguridad para ganar medallas industriales.</p>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <template x-for="badge in badges">
                                <div class="w-9 h-9 rounded-xl flex items-center justify-center border text-xs transition"
                                     :class="badge.unlocked ? 'bg-amber-500/20 border-amber-500/50 text-amber-400 shadow-neon-amber' : 'bg-slate-950 border-slate-800 text-slate-600'"
                                     :title="badge.name">
                                    <i :data-lucide="badge.icon" class="w-4 h-4"></i>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- SCREEN 2: MISSION FIELD SIMULATION -->
            <template x-if="currentScreen === 'mission'">
                <div class="max-w-4xl mx-auto space-y-6">
                    <!-- Mission Header & Timer bar -->
                    <div class="flex flex-wrap items-center justify-between bg-cyber-900 p-4 rounded-2xl border border-slate-800 gap-4">
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-extrabold uppercase tracking-wider px-3 py-1 rounded-xl bg-slate-800 text-slate-300 border border-slate-700" x-text="activeModule === 'pv' ? 'Misión Fotovoltaica' : 'Misión Eólica'"></span>
                            <span class="text-xs text-slate-400 font-mono" x-text="`Escenario ${currentMissionIdx + 1} de ${currentMissions.length}`"></span>
                        </div>
                        <div class="flex items-center gap-4">
                            <!-- Countdown timer -->
                            <div class="flex items-center gap-2 bg-cyber-950 px-3 py-1.5 rounded-xl border border-slate-800 text-xs font-mono">
                                <i data-lucide="timer" class="w-3.5 h-3.5 text-amber-400"></i>
                                <span :class="timer <= 10 ? 'text-rose-400 font-bold animate-pulse' : 'text-slate-300'" x-text="timer + 's'"></span>
                            </div>
                            <div class="flex gap-1">
                                <template x-for="(m, idx) in currentMissions">
                                    <div class="w-7 h-2 rounded-full transition-all"
                                         :class="idx === currentMissionIdx ? 'bg-amber-500 w-9' : idx < currentMissionIdx ? 'bg-emerald-500' : 'bg-slate-800'"></div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- Mission Card Content -->

                async submitReport() {
                    const endpoint = this.appsScriptUrl.trim();
                    const email = this.reportEmail.trim();
                    if (!this.participantName.trim()) {
                        this.reportStatus = 'Escribe el nombre del participante antes de enviar el informe.';
                        return;
                    }
                    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                        this.reportStatus = 'Escribe un correo electrónico válido para recibir el PDF.';
                        return;
                    }
                    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(endpoint)) {
                        this.reportStatus = 'La URL debe ser la URL /exec de una implementación web de Google Apps Script.';
                        return;
                    }
                    if (this.reportSending) return;
                    this.reportSending = true;
                    this.reportStatus = '';
                    const payload = {
                        participantName: this.participantName.trim(),
                        email,
                        moduleName: this.moduleName,
                        safetyScore: this.safetyScore,
                        finalRating: this.finalRating,
                        xp: this.xp,
                        folio: this.folio,
                        scoreBreakdown: this.scoreBreakdown
                    };
                    try {
                        await fetch(endpoint, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                            body: JSON.stringify(payload)
                        });
                        this.reportStatus = 'Solicitud enviada. El navegador no permite confirmar la respuesta del servidor; revisa la hoja de cálculo y el correo para verificar el registro.';
                    } catch (error) {
                        this.reportStatus = 'No se pudo enviar la solicitud. Revisa tu conexión y que la implementación de Apps Script esté activa.';
                    } finally {
                        this.reportSending = false;
                    }

                selectModule(mod) {
                    this.activeModule = mod;

                    this.xp = 0;
                    this.riskLevel = 'BAJO';
                    this.userEquipment = [];

                    this.currentScreen = 'mission';
                    this.folio = 'ES-'+Date.now().toString(36).toUpperCase(); this.certificateDate = new Date().toLocaleString('es-MX'); this.scoreBreakdown={epp:0,procedure:0,time:0,loto:0}; this.persist();

                startTimer() {
                    clearInterval(this.timerInterval);
                    this.timer = 45;
                    this.timerInterval = setInterval(() => {
                        if (this.timer > 0 && !this.answered) {
                            this.timer--;
                        } else if (this.timer === 0 && !this.answered) {
                            this.selectMissionOption(99); // Timeout penalty
                        }
                    }, 1000);
                },

                toggleEquipment(eqId) {
                    if (this.answered) return;
                    if (this.userEquipment.includes(eqId)) {
                        this.userEquipment = this.userEquipment.filter(id => id !== eqId);
                    } else {
                        this.userEquipment.push(eqId);
                    }
                },

                selectMissionOption(optIdx) {
                    if (this.answered) return;
                    clearInterval(this.timerInterval);
                    this.selectedOption = optIdx;
                    this.answered = true;

                    // Validate equipment if required
                    let equipmentOk = true;
                    if (this.currentMission.requiresEquipment) {
                        for (let req of this.currentMission.requiredEquips) {
                            if (!this.userEquipment.includes(req)) equipmentOk = false;
                        }
                    }

                    this.isCorrect = (optIdx === this.currentMission.correctOption && equipmentOk);

                    if (this.isCorrect) {
                        this.scoreBreakdown.procedure = Math.min(35, this.scoreBreakdown.procedure + 8);
                        this.scoreBreakdown.time = Math.min(20, this.scoreBreakdown.time + (this.timer > 20 ? 4 : 2));
                        if (this.currentMission.requiresEquipment) this.scoreBreakdown.epp = Math.min(25, this.scoreBreakdown.epp + 6);
                        this.xp += 50;
                        this.safetyScore = Math.min(100, this.safetyScore + 5);
                    } else {
                        this.safetyScore = Math.max(0, this.safetyScore - 25);
                        this.xp = Math.max(0, this.xp - 10);
                    }

                    this.updateRiskLevel();
                    setTimeout(() => lucide.createIcons(), 50);
                },

                updateRiskLevel() {
                    if (this.safetyScore >= 80) this.riskLevel = 'BAJO';
                    else if (this.safetyScore >= 50) this.riskLevel = 'MODERADO';
                    else this.riskLevel = 'CRÍTICO';
                },

                nextMissionStep() {
                    if (this.currentMissionIdx < this.currentMissions.length - 1) {
                        this.currentMissionIdx++;
                        this.answered = false;
                        this.selectedOption = null;
                        this.userEquipment = [];
                        this.isCorrect = false;
                        this.startTimer();
                    } else {
                        // Transition to Mini-Game Emergency Challenge
                        this.startMinigame();
                    }
                    setTimeout(() => lucide.createIcons(), 50);

                                options: [
                                    "Abrir la caja para localizar el fusible quemado.",
                                    "Activar alarma, aislar desde una zona segura, evacuar y usar el extintor adecuado solo si la ruta es segura.",
                                    "Rociar agua directamente sobre la caja energizada."
                                ],
                                correct: 1
                            },
                            {
                                title: "¡Emergencia: Persona en Contacto con DC!",
                                description: "Un trabajador queda inmóvil junto a un conductor DC posiblemente energizado.",
                                options: [
                                    "Tocar al trabajador y arrastrarlo con las manos desnudas.",
                                    "Aislar la fuente, llamar a emergencias y no acercarse hasta confirmar ausencia de tensión.",
                                    "Lanzar una herramienta metálica para separarlo."
                                ],
                                correct: 1
                            }
                        ] : [
                            {
                            title: "¡Emergencia: Alarma de Rayo Inminente en Torre Eólica!",
                            description: "El sistema de detección atmosférica avisa impacto de rayo en la nacelle en los próximos 30 segundos mientras hay personal trabajando.",
                            options: [
                                "Continuar apretando pernos ya que falta poco para terminar.",
                                "Activar alarma general, descender de inmediato por la escalera usando el sistema anticaídas y asegurar la zona.",
                                "Refugiarse en el cubo de la base sin notificar a supervisión."
                            ],
                            correct: 1
                            },
                            {
                                title: "¡Emergencia: Vibración Anormal en la Góndola!",
                                description: "La turbina aumenta la vibración y se escucha un golpe repetitivo en la multiplicadora.",
                                options: [
                                    "Continuar trabajando hasta identificar visualmente la pieza.",
                                    "Activar parada de emergencia, mantenerse fuera de la línea de fuego y comunicar la anomalía.",
                                    "Acercarse al rotor para sujetarlo manualmente."
                                ],
                                correct: 1
                            },
                            {
                                title: "¡Emergencia: Trabajador Suspendido!",
                                description: "Un técnico queda suspendido del arnés tras una caída dentro de la torre.",
                                options: [
                                    "Subir sin avisar y desengancharlo inmediatamente.",
                                    "Activar rescate planificado, comunicar la ubicación y mantener contacto sin improvisar maniobras.",
                                    "Indicarle que se quite el arnés para bajar más rápido."
                                ],
                                correct: 1
                            }
                        ];
                    }
                    return this.minigameScenarios[this.minigameIdx];
                },

                answerMinigame(idx) {
                    if (this.mgAnswered) return;
                    clearInterval(this.mgInterval);
                    this.mgAnswered = true;
                    this.mgSelected = idx;
                    if (idx === this.minigameScenario.correct) {
                        this.xp += 75;
                        this.safetyScore = Math.min(100, this.safetyScore + 10);
                    } else {
                        this.safetyScore = Math.max(0, this.safetyScore - 20);
                    }
                    this.updateRiskLevel();
                    setTimeout(() => lucide.createIcons(), 50);
                },

                nextMinigameStep() {
                    if (this.minigameIdx < this.minigameScenarios.length - 1) {
                        this.minigameIdx++;
                        this.mgTimer = 20;
                        this.mgAnswered = false;
                        this.mgSelected = null;
                        this.startMinigameTimer();
                    } else {
                        this.goToLotoStage();
                    }
                    setTimeout(() => lucide.createIcons(), 50);
                },

                startMinigameTimer() {
                    clearInterval(this.mgInterval);
                    this.mgInterval = setInterval(() => {
                        if (this.mgTimer > 0 && !this.mgAnswered) {
                            this.mgTimer--;
                        } else if (this.mgTimer === 0 && !this.mgAnswered) {
                            this.answerMinigame(99);
                        }
                    }, 1000);
                },

                goToLotoStage() {
                    clearInterval(this.mgInterval);
                    this.currentScreen = 'loto';
                    this.lotoCompleted = false;
                    this.lotoSteps.forEach(s => s.done = false);
                    setTimeout(() => lucide.createIcons(), 50);
                },

                clickLotoStep(stepId) {
                    let step = this.lotoSteps.find(s => s.id === stepId);
                    if (!step || step.done) return;

                    // Enforce chronological order
                    let prevStepIndex = this.lotoSteps.findIndex(s => s.id === stepId) - 1;
                    if (prevStepIndex >= 0 && !this.lotoSteps[prevStepIndex].done) {
                        return; // Must complete previous step first
                    }

                    step.done = true;
                    this.xp += 25;

                    if (this.lotoSteps.every(s => s.done)) {
                        this.lotoCompleted = true;
                        this.xp += 50;
                        if (this.activeModule === 'pv') this.badges[0].unlocked = true;
                        else this.badges[2].unlocked = true;
                        this.badges[1].unlocked = true; // LOTO badge
                        if (this.safetyScore >= 90) this.badges[3].unlocked = true;
                    }
                    setTimeout(() => lucide.createIcons(), 50);
                },

                toggleSwitch(id) { const order=['dc','ac','test','earth']; const i=order.indexOf(id); if(i!==this.lotoSwitches.filter(s=>s.on).length){this.lotoMessage='Orden incorrecto: completa el control anterior.'; return;} this.lotoSwitches.find(s=>s.id===id).on=true; this.lotoMessage='Control confirmado. Continúa con el siguiente paso.'; },
                finishModule() {
                    this.scoreBreakdown.loto = 20; this.safetyScore = Math.min(100, Math.max(this.safetyScore, this.scoreBreakdown.epp + this.scoreBreakdown.procedure + this.scoreBreakdown.time + this.scoreBreakdown.loto)); this.certificateDate = new Date().toLocaleString('es-MX'); this.persist();
                    this.currentScreen = 'summary';
                    setTimeout(() => lucide.createIcons(), 50);
                },

                restartModule() {
                    this.selectModule(this.activeModule);
                },

                returnToHome() {
                    clearInterval(this.timerInterval);
                    clearInterval(this.mgInterval);
                    this.currentScreen = 'home';
                    setTimeout(() => lucide.createIcons(), 50);
                },

                getOptionClass(optIdx) {
                    if (!this.answered) {
                        return 'bg-cyber-950/80 border-slate-800 hover:border-slate-700 text-slate-300';
                    }
                    if (optIdx === this.currentMission.correctOption) {
                        return 'bg-emerald-950/40 border-emerald-500 text-emerald-200';
                    }
                    if (this.selectedOption === optIdx) {
                        return 'bg-rose-950/40 border-rose-500 text-rose-200';
                    }
                    return 'bg-cyber-950/40 border-slate-900 text-slate-500 opacity-60';
                },

                getScoreMessage() {
                    if (this.safetyScore >= 85) return "¡Impresionante desempeño! Has demostrado dominio absoluto de los protocolos de seguridad, EPP y seccionamiento LOTO.";
                    if (this.safetyScore >= 50) return "Buen trabajo, aunque se registraron algunos fallos en la selección de EPP o tiempos de respuesta. Repasa las normativas OSHA.";
                    return "Atención: Nivel de riesgo elevado. Es necesario reentrenar en el uso de equipos de protección y secuencias de aislamiento eléctrico.";
                }
            }
        }
    </script>
